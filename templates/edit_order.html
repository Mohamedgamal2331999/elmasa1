{% extends "base.html" %}

{% block title %}Edit Order{% endblock %}

{% block content %}
<h1>Edit Order</h1>
<form method="POST" action="{{ url_for('edit_order', order_id=order.id) }}" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-8">
            <div class="mb-3">
                <label for="details" class="form-label">Order Details</label>
                <textarea class="form-control" id="details" name="details" rows="4" required>{{ order.details }}</textarea>
            </div>

            <div class="mb-3">
                <label for="receive_date" class="form-label">Receive Date</label>
                <input type="date" class="form-control" id="receive_date" name="receive_date" value="{% if order.order_type == 'in' %}{{ order.date.strftime('%Y-%m-%d') }}{% endif %}">
            </div>
            <div class="mb-3">
                <label for="deliver_date" class="form-label">Deliver Date</label>
                <input type="date" class="form-control" id="deliver_date" name="deliver_date" value="{% if order.order_type == 'out' %}{{ order.date.strftime('%Y-%m-%d') }}{% endif %}">
            </div>
            <div class="mb-3">
                <label for="product_name" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="product_name" name="product_name" value="{{ order.product_name }}" required>
            </div>
            <div class="mb-3">
                <label for="size" class="form-label">Size (cm): length - width - height</label>
                <input type="text" class="form-control" id="size" name="size" value="{{ order.size }}">
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" value="{{ order.quantity }}" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label for="product_photo" class="form-label">Product Photo</label>
                <input type="file" class="form-control" id="product_photo" name="product_photo">
                {% if order.product_photo %}
                <img src="{{ url_for('static', filename='uploads/' ~ order.product_photo) }}" alt="Product Photo" style="max-width: 200px; margin-top: 10px;">
                {% endif %}
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('orders') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
