{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
<h1>Edit User</h1>
<form method="POST" action="{{ url_for('edit_user', user_id=edit_user.id) }}">
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" value="{{ edit_user.username }}" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password (leave blank to keep current)</label>
        <input type="password" class="form-control" id="password" name="password">
    </div>
    <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <select class="form-control" id="role" name="role" required>
            <option value="admin" {% if edit_user.role == 'admin' %}selected{% endif %}>Admin</option>
            <option value="orders" {% if edit_user.role == 'orders' %}selected{% endif %}>Orders</option>
            <option value="production" {% if edit_user.role == 'production' %}selected{% endif %}>Production</option>
            <option value="inventory" {% if edit_user.role == 'inventory' %}selected{% endif %}>Inventory</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
