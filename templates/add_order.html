{% extends "base.html" %}

{% block title %}Add Order{% endblock %}

{% block content %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-danger">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<h1>Add Order</h1>
<form method="POST" action="{{ url_for('add_order') }}" enctype="multipart/form-data">
    <div class="row">
        <div class="col-md-8">
            <div class="mb-3">
                <label for="details" class="form-label">Order Details</label>
                <textarea class="form-control" id="details" name="details" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="receive_date" class="form-label">Receive Date</label>
                <input type="date" class="form-control" id="receive_date" name="receive_date">
            </div>
            <div class="mb-3">
                <label for="deliver_date" class="form-label">Deliver Date</label>
                <input type="date" class="form-control" id="deliver_date" name="deliver_date">
            </div>
            <div class="mb-3">
                <label for="product_name" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="product_name" name="product_name" required>
            </div>
            <div class="mb-3">
                <label for="size" class="form-label">Size (cm): length - width - height</label>
                <input type="text" class="form-control" id="size" name="size">
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label for="product_photo" class="form-label">Product Photo</label>
                <input type="file" class="form-control" id="product_photo" name="product_photo">
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Add Order</button>
</form>
{% endblock %}
